# Prodigi web — nginx server block for the static build in dist/.
# Every route is a prerendered file, so no application server is needed.
server {
    listen 80;
    server_name prodiginl.com www.prodiginl.com;
    root /var/www/prodigi/dist;
    index index.html;

    # Canonical URLs have no trailing slash.
    rewrite ^/(.+)/$ /$1 permanent;

    # Permanent aliases (mirrors `redirects` in src/routing/manifest.ts).
    location = /demo/ai-chat   { return 301 /intelligence/chat; }
    location = /demo/ai-agent  { return 301 /intelligence/agents; }
    location = /demo/ai-search { return 301 /intelligence/search; }
    location = /demo/ai-voice  { return 301 /intelligence/voice; }
    location = /services       { return 301 /solutions; }

    location / {
        # /product → /product.html. Unknown paths → 404.html (status 404),
        # which also boots the SPA so client-side routes still render.
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(html)$ {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/plain;
}
