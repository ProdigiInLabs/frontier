name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify static output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/intelligence/chat/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
      - name: Accessibility and runtime audit
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:a11y
