# Builds the static site and publishes dist/ to GitHub Pages (prodiginl.com via public/CNAME).
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # No env overrides here on purpose: these values are public (never
      # secrets — see .env.example), so they're committed straight into
      # .env.production instead of sourced from GitHub Actions repository
      # Variables. An unset Actions Variable resolves to an empty string,
      # and Vite treats an explicitly-empty process.env value as "set",
      # silently overriding .env.production's committed value with blank —
      # that footgun is why this step no longer does it that way.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
